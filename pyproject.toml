[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "please-cli"
version = "0.1.0"
description = "Local-first macOS terminal assistant powered by Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
please = "please_cli.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["please_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
